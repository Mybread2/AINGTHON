services:
  db:
    image: postgres:16
    container_name: aingthon-db
    environment:
      POSTGRES_DB: aingthon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - aingthon-db-data:/var/lib/postgresql/data

volumes:
  aingthon-db-data:
